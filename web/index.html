<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI career-translation app for Indian Armed Forces officers transitioning to civilian careers.">

  <!-- iOS meta tags & icons -->
  <!-- apple-mobile-web-app-capable is the tag Safari has historically keyed
       off for reliable standalone/fullscreen "Add to Home Screen" behavior
       across iOS versions; mobile-web-app-capable is the newer vendor-
       neutral equivalent — both are included for maximum compatibility. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Next Career After Fauj">
  <meta name="theme-color" content="#34452F">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Google Sign-In (web): the OAuth 2.0 Web-application Client ID from
       Google Cloud Console — Credentials > Create Credentials > OAuth 2.0
       Client ID > Web application. Must be the SAME client ID set as the
       Worker's GOOGLE_CLIENT_ID secret and passed to the Flutter build as
       --dart-define=GOOGLE_SERVER_CLIENT_ID=... — that shared value is what
       lets an ID token minted here be verified server-side. Also requires
       registering this app's origins (including http://localhost:8767 for
       local dev) as Authorized JavaScript origins on that same client. -->
  <meta name="google-signin-client_id" content="REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Next Career After Fauj</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
