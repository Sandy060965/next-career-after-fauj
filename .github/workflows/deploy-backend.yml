name: Deploy Backend Worker

# Manual only — see deploy-web.yml for why. Runtime secrets (ANTHROPIC_API_KEY,
# TWILIO_*, JWT_SECRET, ADMIN_SECRET, GOOGLE_CLIENT_ID, APP_SHARED_KEY,
# RAPIDAPI_KEY) already live on the Worker itself via `wrangler secret put`
# and are untouched by `wrangler deploy` — this workflow only needs
# CLOUDFLARE_API_TOKEN to push the updated code.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      # Wrangler 4.131.1 (pinned below) requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # Pinned to match package.json's wrangler devDependency (^4.123.0),
      # rather than whatever older default wrangler-action would otherwise
      # install — see deploy-web.yml for the version-mismatch this avoids.
      # wrangler-action's `workingDirectory` doesn't reliably change where
      # `wrangler deploy` resolves its config from — it was picking up the
      # repo-root wrangler.jsonc (the frontend's) instead of this Worker's
      # wrangler.toml. Pointing at the config explicitly sidesteps that.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.131.1'
          workingDirectory: backend/cloudflare-worker
          command: deploy --config backend/cloudflare-worker/wrangler.toml
