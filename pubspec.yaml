name: next_career_after_fauj
description: AI career-translation app for Indian Armed Forces officers transitioning to civilian careers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^12.0.0
  http: ^1.2.2
  archive: ^3.6.1
  xml: ^6.5.0
  url_launcher: ^6.3.1
  speech_to_text: ^7.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
