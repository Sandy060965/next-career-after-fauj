name: next_career_after_fauj
description: AI career-translation app for Indian Armed Forces officers transitioning to civilian careers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^12.0.0
  http: ^1.2.2
  archive: ^3.6.1
  xml: ^6.5.0
  url_launcher: ^6.3.1
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.0.0
  share_plus: ^13.3.0
  pdf: ^3.12.0
  google_sign_in: ^7.2.0
  # Imported directly (web_only.dart) for the web-specific renderButton()
  # API — google_sign_in_web's own README asks for this when a client
  # imports its APIs directly rather than only through google_sign_in.
  google_sign_in_web: ^1.1.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.3
  # Used only by test/cv_templates_test.dart to synthesize a tiny sample
  # photo — already pulled in transitively, declared explicitly so that
  # doesn't depend on staying true.
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/cv_template_previews/
    - assets/cv_template_previews_full/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText/CrimsonText-Regular.ttf
          weight: 400
        - asset: assets/fonts/CrimsonText/CrimsonText-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CrimsonText/CrimsonText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CrimsonText/CrimsonText-Bold.ttf
          weight: 700
